<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raising Deviser Grick</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #grick-container {
            position: relative;
            width: 200px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        canvas, video, img.asset-media {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        canvas {
            display: block;
        }
        .speech-bubble {
            position: absolute;
            top: -35px;
            background: white;
            color: black;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #000;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 20;
        }
        .action-menu {
            position: absolute;
            bottom: -90px;
            background: rgba(22, 36, 71, 0.95);
            border: 2px solid #e94560;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 5px;
            z-index: 20;
        }
        .action-menu button {
            background: #e94560;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="grick-container" onclick="toggleMenu()">
        <div id="speech" class="speech-bubble">Hello!</div>
        <canvas id="chroma-canvas" width="200" height="240"></canvas>
        
        <div id="menu" class="action-menu" onclick="event.stopPropagation()">
            <button onclick="feedCookie()">Feed Cookie 🍪</button>
            <button onclick="petHead()">Pet Head 💖</button>
            <button onclick="thumpHead()">Thump Head 💢</button>
            <button onclick="danceGrick()">Dance 💃</button>
            <button onclick="sleepGrick()">Sleep 💤</button>
            <button onclick="disappear()">Disappear 👻</button>
        </div>
    </div>

    <!-- ซ่อน element มีเดียต้นฉบับที่ดึงตรงจาก Catbox -->
    <video id="vid-idle" src="https://files.catbox.moe/laq4ih.mp4" crossorigin="anonymous" loop muted playsinline></video>
    <img id="img-drag" src="https://files.catbox.moe/gxabnn.png" crossorigin="anonymous">
    <video id="vid-eat" src="https://files.catbox.moe/4k9h08.mp4" crossorigin="anonymous" muted playsinline></video>
    <video id="vid-thump" src="https://files.catbox.moe/bgsjt9.mp4" crossorigin="anonymous" muted playsinline></video>
    <video id="vid-sleep" src="https://files.catbox.moe/t4hi3o.mp4" crossorigin="anonymous" loop muted playsinline></video>
    <img id="img-pet" src="https://files.catbox.moe/p0qfpu.png" crossorigin="anonymous">
    <video id="vid-dance" src="https://files.catbox.moe/zi4hu7.mp4" crossorigin="anonymous" loop muted playsinline></video>

    <script>
        const canvas = document.getElementById("chroma-canvas");
        const ctx = canvas.getContext("2d");
        const speech = document.getElementById("speech");
        const menu = document.getElementById("menu");

        const mediaSources = {
            idle: document.getElementById("vid-idle"),
            drag: document.getElementById("img-drag"),
            eat: document.getElementById("vid-eat"),
            thump: document.getElementById("vid-thump"),
            sleep: document.getElementById("vid-sleep"),
            pet: document.getElementById("img-pet"),
            dance: document.getElementById("vid-dance")
        };

        let currentMode = "idle";
        let hungerTimer = 0;
        let animationFrameId;

        function switchMode(mode) {
            currentMode = mode;
            // หยุดวิดีโอทั้งหมดก่อน
            Object.values(mediaSources).forEach(el => {
                if (el.tagName === "VIDEO") el.pause();
            });

            let activeEl = mediaSources[mode];
            if (activeEl.tagName === "VIDEO") {
                activeEl.currentTime = 0;
                activeEl.play().catch(e => console.log(e));
            }
        }

        // ลูปประมวลผล Chroma Key วาดภาพ/วิดีโอลง Canvas แบบเรียลไทม์
        function processChromaKey() {
            let activeEl = mediaSources[currentMode];
            if (activeEl) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(activeEl, 0, 0, canvas.width, canvas.height);

                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = frame.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    // ตรวจจับและลบพื้นหลังสีน้ำเงิน
                    if (b > 130 && r < 80 && g < 120) {
                        data[i+3] = 0;
                    }
                }
                ctx.putImageData(frame, 0, 0);
            }
            animationFrameId = requestAnimationFrame(processChromaKey);
        }

        // เริ่มต้นทำงาน
        mediaSources.idle.play().then(() => {
            switchMode("idle");
            processChromaKey();
        }).catch(e => {
            switchMode("idle");
            processChromaKey();
        });

        function toggleMenu() {
            if (currentMode === "thump") return; // ถ้าโดนทุบหัวอยู่ เมนูจะไม่เปิด
            menu.style.display = menu.style.display === "flex" ? "none" : "flex";
        }

        function feedCookie() {
            menu.style.display = "none";
            switchMode("eat");
            speech.innerText = "Yummy! 🍪";
            setTimeout(() => {
                speech.innerText = "Hello!";
                switchMode("idle");
            }, 3000);
        }

        function petHead() {
            menu.style.display = "none";
            switchMode("pet");
            speech.innerText = "Hehe~ 💕";
            setTimeout(() => {
                speech.innerText = "Hello!";
                switchMode("idle");
            }, 3000);
        }

        function thumpHead() {
            menu.style.display = "none";
            switchMode("thump"); // ตัดการทำงานทุกอย่างทันทีเมื่อโดนทุบ
            speech.innerText = "Ouch! 💢";
            setTimeout(() => {
                speech.innerText = "Hmph!";
                switchMode("idle");
            }, 3000);
        }

        function danceGrick() {
            menu.style.display = "none";
            switchMode("dance");
            speech.innerText = "Dance time! 🎶";
        }

        function sleepGrick() {
            menu.style.display = "none";
            switchMode("sleep");
            speech.innerText = "Zzz... 💤";
        }

        function disappear() {
            menu.style.display = "none";
            let opacity = 1;
            let fadeInterval = setInterval(() => {
                opacity -= 0.1;
                canvas.style.opacity = opacity;
                if (opacity <= 0) clearInterval(fadeInterval);
            }, 100);
        }

        // ระบบจับเวลาหิว 3 นาทีขึ้นไป (180 วินาที)
        setInterval(() => {
            hungerTimer++;
            if (hungerTimer >= 180 && currentMode === "idle") {
                speech.innerText = "I'm hungry! 🍎";
            }
        }, 1000);
    </script>
</body>
</html>
